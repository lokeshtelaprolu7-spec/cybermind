services:
  - type: web
    name: cybermind-backend
    runtime: python
    rootDir: cybermind/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cybermind-postgres
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "60"
      - key: LLM_PROVIDER
        value: mock
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: cybermind-postgres
    databaseName: cybermind
    user: cybermind_user
    plan: free
