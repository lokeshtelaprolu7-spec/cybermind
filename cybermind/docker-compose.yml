version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: cybermind-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEMO_MODE=true
      - DATABASE_URL=postgresql://cybermind:cybermind_secure_pass@postgres:5432/cybermind
      - SECRET_KEY=cybermind-super-secure-jwt-secret-key-change-in-production-2026
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=cybermind123
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: cybermind-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: cybermind-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=cybermind
      - POSTGRES_PASSWORD=cybermind_secure_pass
      - POSTGRES_DB=cybermind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybermind -d cybermind"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: cybermind-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/cybermind123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cybermind-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
